[project]
name = "tender-watch"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = []

[tool.unittest]
start-directory = "tests"

[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tender_watch", "tender_watch.fixtures"]

[tool.setuptools.package-dir]
"tender_watch.fixtures" = "fixtures"

[tool.setuptools.package-data]
"tender_watch.fixtures" = ["*.json", "oci/*.json"]
